name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的发布 tag（例如 v0.4.0），必须与包版本一致"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # pyproject 使用 dynamic version（单一来源 tdxhub/__init__.py），
      # 因此不能读 [project].version，改为复用 scripts/check_package.py 的静态解析。
      - name: Verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="$(python -c 'import sys; sys.path.insert(0, "scripts"); from check_package import read_source_version; print(read_source_version())')"
          if [[ "${RELEASE_TAG}" != "v${VERSION}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version v${VERSION}"
            exit 1
          fi
          echo "Release tag ${RELEASE_TAG} matches package version v${VERSION}"

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Verify sources, licenses and dependencies in wheel and sdist
        run: uv run --no-project python scripts/check_package.py dist/*.whl dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/tdxhub-sdk/

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
