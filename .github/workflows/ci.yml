name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        dependencies: [core, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked core and tests
        if: matrix.dependencies == 'core'
        run: uv sync --frozen --extra test
      - name: Install locked optional dependencies and tests
        if: matrix.dependencies == 'all'
        run: uv sync --frozen --all-extras
      - run: uv lock --check
      - run: uv pip check
      - run: uvx ruff check --select E9,F63,F7,F82 tdxhub tests scripts
      - run: uv run --frozen --no-sync python -m compileall -q tdxhub tests scripts
      - run: uv run --frozen --no-sync pytest

  release-version:
    name: Release version source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # publish.yml 依赖这条命令推导发布版本；它一旦失效，发布会在校验步骤静默断掉。
      - name: Package version must be statically readable
        run: python scripts/check_package.py --print-version

  wheel:
    uses: ./.github/workflows/django.yml
